[assistant]
name = "AL"
privacy = "strict-local"
log_level = "INFO"

[audio]
sample_rate = 16000
channels = 1
block_seconds = 0.25
calibration_seconds = 0.6
silence_seconds = 0.9
max_record_seconds = 15.0
min_speech_seconds = 0.12
# Use PipeWire's input route so it can resample to 16 kHz.
input_device_name = "pipewire"
# A conservative floor rejects low-level room noise; tune only after testing.
energy_threshold = 0.00025
# Adaptive threshold = max(energy_threshold, lower-quartile calibration RMS * multiplier).
threshold_multiplier = 2.0
# Set true temporarily to print per-block RMS/peak levels while diagnosing the mic.
debug_levels = false

[stt]
engine = "faster-whisper"
model = "base.en"
device = "cpu"
compute_type = "int8"
language = "en"
beam_size = 3
vad_filter = false

[tts]
# Local Kokoro ONNX model and voice bundle. Download both files before enabling TTS.
model = "/home/REPLACE_WITH_YOUR_USERNAME/.local/share/al/kokoro/kokoro-v1.0.onnx"
voices = "/home/REPLACE_WITH_YOUR_USERNAME/.local/share/al/kokoro/voices-v1.0.bin"
# af_heart is the selected English female voice.
voice = "af_heart"
# 1.0 is natural default pacing; try 0.95 for slightly slower delivery.
speed = 1.0

[ui]
# Future Quickshell HUD colors, inspired by the uploaded teal DNA-analysis reference.
background = "#071514"
panel = "#0B2221"
accent = "#39E6C0"
secondary_accent = "#79B9B2"
text = "#D5F4EC"
muted = "#73938E"
