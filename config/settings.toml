[assistant]
name = "AL"
privacy = "strict-local"
log_level = "INFO"

[audio]
sample_rate = 16000
channels = 1
block_seconds = 0.25
silence_seconds = 0.9
max_record_seconds = 15.0
# Pin AL to the built-in laptop microphone, not the changing system default.
input_device_name = "Ryzen HD Audio Controller Stereo Microphone"
# Increase this if the built-in laptop mic is noisy; decrease if it misses speech.
energy_threshold = 0.00015

[stt]
engine = "faster-whisper"
model = "base.en"
device = "cpu"
compute_type = "int8"
language = "en"
beam_size = 1

[tts]
# Set to an installed Piper voice model path. Empty disables speech output until configured.
model = ""
executable = "piper"

[ui]
# Future Quickshell HUD colors, inspired by the uploaded teal DNA-analysis reference.
background = "#071514"
panel = "#0B2221"
accent = "#39E6C0"
secondary_accent = "#79B9B2"
text = "#D5F4EC"
muted = "#73938E"
