[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "al-local-assistant"
version = "0.1.0"
description = "Local-first push-to-talk assistant for Arch Linux and Hyprland"
requires-python = ">=3.12"
dependencies = ["sounddevice>=0.5.1", "numpy>=2.0", "faster-whisper>=1.1", "tomli-w>=1.0", "kokoro-onnx>=0.4.7", "soundfile>=0.14"]

[project.scripts]
al = "al.cli:main"

[tool.setuptools.packages.find]
include = ["al*"]
